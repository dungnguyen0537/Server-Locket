# nginx_stream.conf
# Thêm block này vào nginx.conf (trong http{} ngoài, ngang cấp với http{})
# aaPanel: /www/server/nginx/conf/nginx.conf
#
# QUAN TRỌNG: Block stream{} phải nằm NGOÀI http{}, không phải trong http{}
# Thêm dòng này vào cuối file nginx.conf:
#   include /www/server/nginx/conf/stream.conf;
# Sau đó tạo file /www/server/nginx/conf/stream.conf với nội dung bên dưới

stream {
    # Đọc SNI header mà không decrypt SSL
    ssl_preread on;

    # Map SNI -> backend
    map $ssl_preread_server_name $backend_addr {
        # RevenueCat + Firebase + Locket API -> proxy của mình (port 8443 hoặc port proxy)
        api.revenuecat.com                           127.0.0.1:8443;
        firebaseremoteconfig.googleapis.com          127.0.0.1:8443;
        firebaseremoteconfigrealtime.googleapis.com  127.0.0.1:8443;
        firebaselogging.googleapis.com               127.0.0.1:8443;
        api.locketcamera.com                         127.0.0.1:8443;

        # Tất cả domain khác -> Nginx HTTPS handler nội bộ (port 4443)
        default             127.0.0.1:4443;
    }

    server {
        listen 443;
        listen [::]:443;
        proxy_pass $backend_addr;
        ssl_preread on;
        proxy_connect_timeout 10s;
        proxy_timeout 60s;
    }
}
